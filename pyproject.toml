[project]
name = "quoted-printable-codec"
version = "0.1.0"
description = "Encodes and decodes RFC 2045 quoted-printable content, handling soft line breaks and hex escapes."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
